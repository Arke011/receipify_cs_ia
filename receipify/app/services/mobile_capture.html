<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send receipt to Receipify</title>
<style nonce="__NONCE__">
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
  button, input { font: inherit; margin: .6rem 0; }
  button { padding: .7rem 1rem; }
  img { display: block; max-width: 100%; max-height: 45vh; margin: 1rem 0; }
  img[hidden] { display: none; }
  #status { white-space: pre-line; }
</style>
<h1>Send a receipt</h1>
<p>Take a clear photo with the whole receipt in view, or choose an existing photo.</p>
<label>Take photo<br><input id="camera" type="file" accept="image/*" capture="environment"></label><br>
<label>Choose photo<br><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/bmp,image/gif"></label>
<img id="preview" alt="Selected receipt preview" hidden>
<button id="send" disabled>Send to computer</button>
<p id="status" role="status" aria-live="polite">Keep Receipify open on your computer. One photo per connection.</p>
<p><small>This transfer uses your local network without encryption. Use trusted Wi-Fi. Photos are not sent to an online service.</small></p>
<script nonce="__NONCE__">
const camera = document.querySelector('#camera');
const file = document.querySelector('#file');
const preview = document.querySelector('#preview');
const send = document.querySelector('#send');
const status = document.querySelector('#status');
let selected, previewUrl;
function choose(event) {
  selected = event.target.files[0];
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  preview.hidden = true;
  send.disabled = !selected;
  if (!selected) return;
  if (selected.size > 15 * 1024 * 1024) {
    status.textContent = 'Photo is larger than 15 MB. Choose a smaller JPEG or PNG.';
    send.disabled = true;
    return;
  }
  previewUrl = URL.createObjectURL(selected);
  preview.src = previewUrl;
  preview.hidden = false;
  status.textContent = 'Check the photo, then send it. JPEG and PNG are recommended.';
}
camera.addEventListener('change', choose);
file.addEventListener('change', choose);
preview.addEventListener('error', () => { preview.hidden = true; });
send.addEventListener('click', async () => {
  if (!selected) return;
  send.disabled = camera.disabled = file.disabled = true;
  status.textContent = 'Sending…';
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  try {
    const response = await fetch(location.pathname, {
      method: 'POST', headers: {'Content-Type': 'application/octet-stream'},
      body: selected, signal: controller.signal
    });
    const message = await response.text();
    status.textContent = message;
    if (!response.ok && response.status !== 410 && response.status !== 409) {
      send.disabled = camera.disabled = file.disabled = false;
    }
  } catch (error) {
    status.textContent = 'Connection lost or timed out. Check the computer: the photo may already have arrived. If it has not, reconnect using a new QR code.';
    send.disabled = camera.disabled = file.disabled = false;
  } finally { clearTimeout(timeout); }
});
</script>
</html>
